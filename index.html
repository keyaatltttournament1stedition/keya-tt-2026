<title>KEYA ATL Table Tennis Tournament 2026</title>

<style>
:root{--bg:#06122a;--panel:#0c1d3d;--panel2:#11264f;--line:#1f3768;--text:#eaf0ff;--mute:#93a4c6;--gold:#ffcc00;--red:#e11d48;--green:#22c55e;--blue:#3b82f6;
--MS:#3b82f6;--MD:#22c55e;--WS:#ec4899;--WD:#f472b6;--XD:#f59e0b;--KS:#a855f7}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:20;background:rgba(6,18,42,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:58px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.ball{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 35%,#d9e2f2 70%);box-shadow:0 0 0 3px var(--red)}
.logo small{display:block;font-weight:500;color:var(--mute);font-size:11px;line-height:1}
nav{display:flex;gap:4px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:8px 13px;border-radius:999px;text-decoration:none;color:var(--mute);font-weight:600;white-space:nowrap;font-size:13.5px}
nav a.on{background:var(--gold);color:#0b1f3a}
.hero{margin:18px 0;border-radius:22px;padding:26px 24px;position:relative;overflow:hidden;
 background:radial-gradient(700px 300px at 85% -20%,rgba(59,130,246,.55),transparent 60%),linear-gradient(135deg,#0d2a66,#0a1a3c 60%,#1a0b24);border:1px solid var(--line)}
.hero h1{margin:6px 0 4px;font-size:clamp(28px,5vw,48px);line-height:1.05;font-style:italic;font-weight:800}
.hero h1 span{color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.chip.gold{background:var(--gold);color:#0b1f3a;border:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.stat{background:rgba(255,255,255,.06);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px}
.stat span{color:var(--mute);font-size:12px}
h2.sec{font-size:18px;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec:before{content:"";width:6px;height:20px;border-radius:3px;background:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{border-radius:14px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);cursor:pointer;position:relative;overflow:hidden}
.cat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.cat b{display:block;font-size:15px}.cat span{color:var(--mute);font-size:12px}
.match{display:grid;grid-template-columns:74px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;position:relative}
.match.final{border-color:rgba(255,204,0,.55);background:linear-gradient(90deg,rgba(255,204,0,.08),var(--panel) 40%)}
.match.live{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.tm{font-weight:700;font-size:15px;line-height:1.1}
.tm small{display:block;color:var(--mute);font-weight:500;font-size:11.5px;margin-top:3px}
.ev{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:11.5px;font-weight:600;color:var(--mute)}
.ev span,.ev b{white-space:nowrap}.ev i{width:9px;height:9px;border-radius:3px;background:var(--c);display:inline-block}
.vs{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-top:4px}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm.tbd{color:var(--mute);font-weight:500;font-style:italic}
.nm.w{color:var(--gold)}
.nm.l{color:var(--mute)}
.g{font-variant-numeric:tabular-nums;color:var(--mute);font-size:12.5px;text-align:right;white-space:nowrap}
.g b{color:var(--text)}
.tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:rgba(34,197,94,.18);color:#86efac;margin-left:6px;vertical-align:1px}
.tag.bi{background:rgba(245,158,11,.18);color:#fcd34d}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--mute);white-space:nowrap}
.pill.live{background:var(--red);color:#fff;animation:pulse 1.4s infinite}
.pill.done{background:rgba(34,197,94,.18);color:#86efac}
.pill.soon{background:rgba(59,130,246,.2);color:#93c5fd}
@keyframes pulse{50%{opacity:.6}}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.f{border:1px solid var(--line);background:var(--panel);color:var(--mute);padding:7px 12px;border-radius:999px;font:600 12.5px Poppins,sans-serif;cursor:pointer}
.f.on{background:var(--text);color:#0b1f3a;border-color:var(--text)}
.f.c.on{background:var(--c);border-color:var(--c);color:#fff}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:500 14px Poppins,sans-serif;outline:none}
.search:focus{border-color:var(--gold)}
.sess{display:flex;align-items:baseline;gap:10px;margin:18px 0 8px;font-weight:700}
.sess span{color:var(--mute);font-weight:500;font-size:12.5px}
.empty{color:var(--mute);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:14px}
/* bracket */
.bwrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel);max-height:78vh;position:relative}
.bracket{position:relative}
.bcol-h{position:sticky;top:0;z-index:3;display:flex;background:var(--panel2);border-bottom:1px solid var(--line)}
.bcol-h div{flex:0 0 auto;padding:8px 12px;font-weight:700;font-size:12px;color:var(--gold)}
.bcol-h div small{display:block;color:var(--mute);font-weight:500;font-size:10.5px}
.bm{position:absolute;width:210px;background:#0a1834;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12.3px}
.bm.final{border-color:var(--gold)}
.bm.live{border-color:var(--red)}
.bm .r{display:flex;justify-content:space-between;gap:6px;padding:4px 8px;height:24px;align-items:center}
.bm .r+.r{border-top:1px solid var(--line)}
.bm .r .nm{max-width:150px}
.bm .h{position:absolute;top:-15px;left:2px;font-size:9.5px;color:var(--mute);white-space:nowrap}
.bm .h b{color:#f87171}
svg.links{position:absolute;left:0;top:0;pointer-events:none}
.champ{position:absolute;width:210px;padding:10px;border-radius:12px;background:linear-gradient(135deg,#ffcc00,#ffdf5d);color:#0b1f3a;font-weight:800;text-align:center}
.champ small{display:block;font-weight:600;font-size:11px}
.note{color:var(--mute);font-size:12.5px;margin:8px 0}
.rules table{width:100%;border-collapse:collapse;font-size:13.5px}
.rules th,.rules td{padding:10px;border-bottom:1px solid var(--line);text-align:center}
.rules th:first-child,.rules td:first-child{text-align:left}
.rules td.b5{color:var(--gold);font-weight:700}.rules td.b7{color:#fb7185;font-weight:800}
.rules ul{margin:0;padding-left:18px;line-height:1.7}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.pbtn{text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px;cursor:pointer;font:600 13.5px Poppins,sans-serif}
.pbtn span{display:block;color:var(--mute);font-weight:500;font-size:11.5px}
.desk{position:fixed;right:14px;bottom:14px;z-index:30;background:var(--gold);color:#0b1f3a;border:0;border-radius:999px;padding:11px 16px;font:700 13px Poppins,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4);cursor:pointer}
.desk.on{background:var(--red);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:18px;max-height:90vh;overflow:auto}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:0 0 4px}
.wbtn{display:block;width:100%;text-align:left;margin:6px 0;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0a1834;color:var(--text);font:600 14px Poppins,sans-serif;cursor:pointer}
.wbtn.on{border-color:var(--gold);background:rgba(255,204,0,.12)}
.games{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0}
.games label{font-size:10.5px;color:var(--mute);text-align:center}
.games input{width:100%;padding:8px 2px;border-radius:8px;border:1px solid var(--line);background:#0a1834;color:var(--text);text-align:center;font:600 13px Poppins,sans-serif}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:12px;border-radius:12px;border:0;font:700 14px Poppins,sans-serif;cursor:pointer}
.btn.p{background:var(--gold);color:#0b1f3a}.btn.s{background:#1f3768;color:var(--text)}.btn.d{background:transparent;color:#fb7185;border:1px solid #7f1d1d}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#111827;border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:50;display:none}
footer{color:var(--mute);font-size:12px;text-align:center;padding:30px 0 80px}
.edit-hint{cursor:pointer}
.edit-hint:hover{border-color:var(--gold)}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.grid2,.cats{grid-template-columns:1fr 1fr}.logo small{display:none}}
@media(max-width:600px){.bar{flex-wrap:wrap;height:auto;padding:8px 14px 6px}nav{margin-left:0;width:100%}nav a{padding:7px 11px}}
@media(max-width:480px){.cats{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.match{grid-template-columns:52px 1fr}.match .pill{position:absolute;right:10px;top:9px}.match .ev{padding-right:52px}}
</style>
</head>

const DAY0={1:Date.UTC(2026,10,28),2:Date.UTC(2026,10,29)};

function entryOf(slot){
  if(!slot.startsWith("W:"))return slot;
  const id=slot.slice(2), r=RES[id];
  if(r&&r.st==="done"&&(r.w==="a"||r.w==="b"))return entryOf(M[id][r.w]);
  return null;
}
function nameOf(eid,ev,shortForm){
  const e=E[eid]; if(!e)return "";

  return (doubles&&shortForm)?e.s:e.l;

function slotName(m,side){
  const o=OVR[m.id]&&OVR[m.id][side];
  if(o)return {txt:o,eid:null};
  const s=m[side];
  if(!s.startsWith("W:"))return {eid:s};
  const id=s.slice(2), r=RES[id];
  if(r&&r.st==="done"&&(r.w==="a"||r.w==="b"))return slotName(M[id],r.w);
  return {tbd:id};
}

function slotHTML(m,side,shortForm){
  const n=slotName(m,side), r=RES[m.id];

  if(n.tbd)return `<div class="${cls} tbd">Winner ${esc(n.tbd)}</div>`;
  if(n.txt)return `<div class="${cls}">${esc(n.txt)}</div>`;
  const eid=n.eid;
  let extra="";
  if(m.ev==="KS"&&E[eid].age)extra=` <span style="color:var(--mute);font-weight:500">(${E[eid].age})</span>`;

function gamesHTML(m,side){

  return `<div class="g">${r.g.map(x=>x[i]>x[1-i]?`<b>${x[i]}</b>`:x[i]).join(" ")}</div>`;

function pill(m){
  const s=status(m);

  if(s==="live")return `<span class="pill live">● LIVE</span>`;
  const now=Date.now(), st=mTime(m,"start");

  <input class="search" id="q" placeholder="Search a name or match ID (e.g. Varun, MS-QF1)" value="${esc(st.q)}">
  ${sess.map(([s,t])=>{const xs=ms.filter(m=>m.session===s);return xs.length?`<div class="sess">${s}<span>${t} · ${xs.length} matches</span></div>`+xs.map(matchCard).join(""):""}).join("")||'<div class="empty" style="margin-top:14px">No matches match these filters.</div>'}`;
}

const SECTIONS={
 MS:[["Quarter 1",["MS-QF1"]],["Quarter 2",["MS-QF2"]],["Quarter 3",["MS-QF3"]],["Quarter 4",["MS-QF4"]],["Semis & Final",["MS-F"],["MS-QF1","MS-QF2","MS-QF3","MS-QF4"]]],
 MD:[["Top half",["MD-SF1"]],["Bottom half",["MD-SF2"]],["Final",["MD-F"],["MD-SF1","MD-SF2"]]],
 WS:[["Full draw",["WS-F"]]],WD:[["Full draw",["WD-F"]]],XD:[["Full draw",["XD-F"]]],KS:[["Full draw",["KS-F"]]]};
function draws(){
  const secs=SECTIONS[st.dev];
  return `<h2 class="sec">Draws</h2>
  <div class="filters">${EVS.map(e=>`<button class="f c ${st.dev===e?'on':''}" style="--c:var(--${e})" data-dev="${e}">${EVN[e]}</button>`).join("")}</div>

  <p class="note">${DATA.notes[st.dev]}</p>
  <div class="bwrap" id="bwrap"></div>`;
}
function lvl(m){const rs=ROUNDS.filter(r=>DATA.matches.some(x=>x.ev===m.ev&&x.round===r));return rs.indexOf(m.round)}
function drawBracket(){
  const [_,roots,cutArr]=SECTIONS[st.dev][st.sec]||SECTIONS[st.dev][0];
  const cut=new Set(cutArr||[]);
  const RH=30, BW=210, GAP=46, TOP=46;
  let row=0; const pos={}; const boxes=[]; const links=[];
  function place(mid){
    const m=M[mid]; const ys=[];
    for(const side of ["a","b"]){
      const s=m[side];
      if(s.startsWith("W:")&&!cut.has(s.slice(2))){const y=place(s.slice(2));ys.push(y);links.push([s.slice(2),mid,side]);}
      else{ys.push(row*RH+RH/2);row++;}
    }
    const y=(ys[0]+ys[1])/2; pos[mid]=y; boxes.push(mid); return y;
  }
  roots.forEach((r,i)=>{if(i)row+=1;place(r)});
  const lv=boxes.map(id=>lvl(M[id])); const minL=Math.min(...lv), maxL=Math.max(...lv);
  const X=id=>16+(lvl(M[id])-minL)*(BW+GAP);
  const isFinalRoot=roots.length===1&&M[roots[0]].round==="Final";
  const W=16+(maxL-minL+1)*(BW+GAP)+(isFinalRoot?BW:0)+16, H=row*RH+TOP+30;
  const cols=[];for(let l=minL;l<=maxL;l++){const ms=boxes.filter(id=>lvl(M[id])===l).map(id=>M[id]);cols.push(ms)}
  let html=`<div class="bracket" style="width:${W}px;height:${H}px">`;
  html+=`<div class="bcol-h" style="width:${W}px">${cols.map(ms=>{const t=[...new Set(ms.map(m=>(m.day===1?'Sat ':'Sun ')+m.sl))];return `<div style="width:${BW+GAP}px">${ms[0].round}<small>${t[0]}${t.length>1?' – '+t[t.length-1]:''}</small></div>`}).join("")}${isFinalRoot?`<div style="width:${BW}px">Champion</div>`:''}</div>`;
  let svg=`<svg class="links" width="${W}" height="${H}">`;
  for(const [c,p,side] of links){
    const x1=X(c)+BW, y1=TOP+pos[c], x2=X(p), y2=TOP+pos[p]+(side==="a"?-12:12), xm=x1+GAP/2;
    svg+=`<path d="M${x1} ${y1}H${xm}V${y2}H${x2}" fill="none" stroke="#2c4a85" stroke-width="1.5"/>`;
  }
  svg+=`</svg>`; html+=svg;
  for(const id of boxes){
    const m=M[id], s=status(m);
    html+=`<div class="bm ${m.round==='Final'?'final':''} ${s==='live'?'live':''} ${deskOn?'edit-hint':''}" data-id="${id}" style="left:${X(id)}px;top:${TOP+pos[id]-25}px">
      <div class="h"><b>${id}</b> · ${m.day===1?'Sat':'Sun'} ${m.sl} · T${m.table} · Bo${m.bo}${s==='live'?' · <b>LIVE</b>':''}</div>
      <div class="r">${slotHTML(m,"a",true)}${gamesHTML(m,"a")}</div><div class="r">${slotHTML(m,"b",true)}${gamesHTML(m,"b")}</div></div>`;
  }
  if(isFinalRoot){const f=M[roots[0]];const r=RES[f.id];const cn=r&&r.st==="done"&&r.w?slotText(f,r.w,false):null;
    html+=`<div class="champ" style="left:${X(f.id)+BW+GAP}px;top:${TOP+pos[f.id]-22}px">🏆 ${cn?esc(cn):'Champion'}<small>${EVN[f.ev]}</small></div>`}
  html+=`</div>`;
  $("#bwrap").innerHTML=html;
}

function players(){

    const confirmed=mine.filter(m=>["a","b"].some(s=>{const e=entryOf(m[s]);return e&&E[e].m.includes(p)}));
    const elim=confirmed.some(m=>status(m)==="done"&&!E[entryOf(m[RES[m.id].w])].m.includes(p));

     <h2 class="sec">Matches</h2>${confirmed.map(matchCard).join("")||'<div class="empty">No confirmed matches yet.</div>'}
     ${nextPossible.length?`<h2 class="sec">If ${esc(p.split(" ")[0])} keeps winning</h2>${nextPossible.map(matchCard).join("")}`:""}`;

}

async function save(val){

    const ref=db.collection("results").doc(id);

    $("#modal").classList.remove("on");toast("Saved ✓");
  }catch(e){toast(e&&e.code==="invalid_argument"?"Only organisers can save results":"Could not save — try again")}
}
function toast(t){const el=$("#toast");el.textContent=t;el.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>el.style.display="none",2200)}

// ---------- live data (Google Sheet, polled) ----------
const BASE={};DATA.matches.forEach(m=>BASE[m.id]={day:m.day,start:m.start,end:m.end,table:m.table,sl:m.sl,session:m.session});
const SHEET_ID="1Q7WuSG2c_YSNoo9DX2zQ0j8S0HXsMeT33cAoS4MNdB8";
const SHEET_URL="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/edit";
let lastSync=null, feedErr=false, inflight=false;
function cellText(c){
  if(!c||c.v===null||c.v===undefined)return "";
  if(typeof c.v==="string"&&/^Date\(/.test(c.v)){const p=c.v.match(/\d+/g).map(Number);return (p[1]+1)+"-"+p[2]}
  return String(c.f!=null&&typeof c.v!=="string"?c.f:c.v).trim();
}
function parseGames(t){
  const out=[];(t.match(/\d+\s*[-–:\/ ]\s*\d+/g)||[]).forEach(x=>{const n=x.match(/\d+/g).map(Number);if(n.length===2)out.push(n)});return out;
}
function whoWon(m,t){
  t=t.trim().toLowerCase(); if(!t)return null;
  if(t==="a"||t==="1")return "a"; if(t==="b"||t==="2")return "b";
  for(const side of ["a","b"]){const n=slotName(m,side);if(n.tbd)continue;const full=n.txt||E[n.eid].l;const L=(full+" "+(n.eid?E[n.eid].s:"")).toLowerCase();if(L.includes(t)||t.includes(full.toLowerCase().split(" ")[0]))return side}
  return null;
}
window.__sheetCb=function(resp){
  inflight=false;
  try{
    if(!resp||resp.status==="error")throw 0;
    const rows=resp.table.rows||[];
    const raw={};const ovr={};
    // reset timings to the original plan, then apply any changes typed in the sheet
    DATA.matches.forEach(m=>Object.assign(m,BASE[m.id]));
    rows.forEach(r=>{const c=r.c||[];const id=cellText(c[0]);const m=M[id];if(!m)return;
      raw[id]={st:cellText(c[8]).toUpperCase(),w:cellText(c[9]),g:cellText(c[10]),wo:/^y/i.test(cellText(c[11]))};
      // names (columns G, H)
      for(const [side,ci] of [["a",6],["b",7]]){
        const t=cellText(c[ci]); if(!t||/^winner/i.test(t))continue;
        const s0=m[side]; const canon=s0.startsWith("W:")?"":E[s0].l;
        if(t.toLowerCase()!==canon.toLowerCase()){ovr[id]=ovr[id]||{};ovr[id][side]=t}
      }
      // day (B), time (C), table (D)
      const dv=c[1]&&c[1].v, tv=c[2]&&c[2].v, tb=cellText(c[3]);
      let day=null;
      if(typeof dv==="string"&&/^Date\(/.test(dv)){const p=dv.match(/\d+/g).map(Number);day=p[2]===28?1:p[2]===29?2:null}
      else{const t=cellText(c[1]).toLowerCase();if(/sat|28/.test(t))day=1;else if(/sun|29/.test(t))day=2}
      let mins=null;
      if(typeof tv==="string"&&/^Date\(/.test(tv)){const p=tv.match(/\d+/g).map(Number);if(p.length>=5)mins=p[3]*60+p[4]}
      else if(typeof tv==="number"){mins=Math.round(tv*1440)}
      else{const mt=cellText(c[2]).match(/(\d{1,2})[:.](\d{2})\s*([ap])?/i);if(mt){let h=+mt[1];const ap=(mt[3]||"").toLowerCase();if(ap==="p"&&h<12)h+=12;if(ap==="a"&&h===12)h=0;if(!ap&&h>=1&&h<=8)h+=12;mins=h*60+(+mt[2])}}
      const tn=parseInt(tb.replace(/\D/g,""));
      const len=m.end-m.start;
      if(day)m.day=day;
      if(mins!==null&&mins>0){m.start=mins;m.end=mins+len;const h=Math.floor(mins/60),mi=mins%60;m.sl=((h+11)%12+1)+":"+String(mi).padStart(2,"0")+(h<12?" AM":" PM");m.session=mins<13*60?"Morning":"Evening"}
      if(tn===1||tn===2)m.table=tn;
    });
    OVR=ovr;
    DATA.matches.sort((x,y)=>x.day-y.day||x.start-y.start||x.table-y.table);
    // resolve in schedule order so later rounds can see earlier winners
    const res={};RES=res;
    DATA.matches.forEach(m=>{
      const r=raw[m.id];if(!r)return;
      const g=parseGames(r.g);
      let w=whoWon(m,r.w);
      if(!w&&g.length&&(r.st.startsWith("D")||r.st==="")){const a=g.filter(x=>x[0]>x[1]).length,b=g.length-a;const need=Math.ceil(m.bo/2);if(a>=need)w="a";else if(b>=need)w="b"}
      if(w&&!r.st.startsWith("L"))res[m.id]={st:"done",w,g,wo:r.wo};
      else if(r.st.startsWith("L"))res[m.id]={st:"live",g};
    });
    lastSync=new Date();feedErr=false;
  }catch(e){feedErr=true}
  const a=document.activeElement&&document.activeElement.id;
  if(a!=="q"&&a!=="pq")render(); else updFoot();
};
function poll(){
  if(inflight&&Date.now()-inflight<20000)return;
  inflight=Date.now();
  const s=document.createElement("script");
  s.src="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json;responseHandler:__sheetCb&headers=1&_="+Date.now();
  s.onerror=()=>{inflight=false;feedErr=true;updFoot()};
  s.onload=()=>s.remove();
  document.body.appendChild(s);
}
function updFoot(){
  const t=lastSync?lastSync.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit",second:"2-digit"}):"";
  $("#foot").innerHTML=`KEYA ATL Table Tennis Tournament · 1st Edition · Keya Around The Life<br>
   ${feedErr?'⚠️ Live scores could not be loaded — retrying…':lastSync?'● Live scores · updated '+t+' · refreshes every 30 s':'Loading live scores…'}
   <br><a href="${SHEET_URL}" target="_blank" rel="noopener" style="color:var(--gold)">Score desk (organisers only)</a>`;
}
route();poll();
setInterval(()=>{if(document.visibilityState!=="hidden")poll()},30000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")poll()});
</script>
